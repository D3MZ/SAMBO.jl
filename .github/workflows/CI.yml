name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1.12'
          - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - name: Test cross-runtime comparator
        if: matrix.version == '1.12'
        run: >-
          python3 -m unittest -v
          benchmark/test_compare_correctness.py
          benchmark/test_update_readme.py
          benchmark/test_update_correctness_readme.py
      - name: Generate instrumented-line coverage
        if: matrix.version == '1.12'
        run: julia scripts/instrumented_lcov.jl src ext > lcov.info
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.12'
        with:
          files: lcov.info
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
  threaded:
    name: Julia 1.12 - 4 threads
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JULIA_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  core:
    name: Core without weak dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate core environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run core tests
        run: julia --project=. test/core_runtests.jl
  correctness:
    name: Native-default cross-runtime non-inferiority
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Instantiate Julia environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - run: python -m pip install --requirement benchmark/requirements-correctness.txt
      - run: python -m unittest -v benchmark/test_python_capabilities.py
      - run: julia --project=. benchmark/correctness_julia.jl > julia-correctness.csv
      - run: python benchmark/correctness_python.py > python-correctness.csv
      - run: python benchmark/compare_correctness.py julia-correctness.csv python-correctness.csv
  extensions:
    name: Extension - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OptimizationBase
            package: OptimizationBase
            test: optimization
          - name: MLJTuning
            package: MLJTuning
            test: mlj
          - name: SurrogatesBase
            package: SurrogatesBase
            test: surrogates
          - name: Makie
            package: CairoMakie
            test: makie
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Configure isolated extension environment
        shell: julia --project=/tmp/sambo-extension --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(path=pwd())
          Pkg.add("${{ matrix.package }}")
      - name: Test extension
        run: julia --project=/tmp/sambo-extension test/extensions/${{ matrix.test }}.jl
      - name: Compare Python and Julia plot images
        if: matrix.test == 'makie'
        run: julia --project=/tmp/sambo-extension reference/compare_plots.jl
  inference:
    name: Native inference checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Run JET checks
        run: |
          julia --project=/tmp/sambo-jet -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.add("JET")'
          julia --project=/tmp/sambo-jet test/inference.jl
  allocations:
    name: Warm allocation regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Instantiate test environment
        run: julia --project=test -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'
      - name: Run allocation checks
        run: julia --project=test -e 'using SAMBO, Random, Test; include("test/allocations.jl")'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Configure doc environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using SAMBO
          DocMeta.setdocmeta!(SAMBO, :DocTestSetup, :(using SAMBO); recursive=true)
          doctest(SAMBO)
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
